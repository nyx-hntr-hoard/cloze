name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      cloud-url-set: ${{ steps.check.outputs.set }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: check
        run: echo "set=${{ vars.DEXIE_CLOUD_URL != '' }}" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build
        env:
          VITE_DEXIE_CLOUD_URL: ${{ vars.DEXIE_CLOUD_URL }}
      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.set == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.cloud-url-set == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
